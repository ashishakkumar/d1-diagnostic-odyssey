[project]
name = "d1-foundation"
version = "0.0.0"
requires-python = ">=3.12"
description = "Safe-core foundation. For research use only. Not for use in diagnostic procedures."
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2",
  "phenopackets>=2.0.2",
  "pronto>=2.5",
  "textstat>=0.7.7",
  "numpy>=2",
  "tokenizers>=0.20",
]

[tool.pytest.ini_options]
pythonpath = ["contracts/src", "services/api", "services/scoring", "services/safety", "services/ingest/src", "services/llm", "eval"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["contracts/src", "services/api", "services/llm", "services/scoring", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I"]
