[project]
name = "d1-api"
version = "0.0.1"
description = "Session binding for the approval gate. No routes in this package yet."
requires-python = ">=3.12"
dependencies = [
  "d1-contracts",
  "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
