[project]
name = "d1-api"
version = "0.0.1"
description = "Session binding for the approval gate, and the notebook routes."
requires-python = ">=3.12"
dependencies = [
  "d1-contracts",
  "psycopg[binary]>=3.2",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
