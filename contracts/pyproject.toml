[project]
name = "d1-contracts"
version = "0.0.1"
description = "Pipeline contract for the safe core. The case is a Phenopacket v2 document."
requires-python = ">=3.12"
dependencies = [
  "phenopackets>=2.0.2",
  "pydantic>=2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
